<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طباعة الملصقات العمودية - Epson TM-T20III</title>
    <!-- مكتبات معالجة الإكسيل والـ PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .file-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="file"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>طابعة الملصقات (Epson)</h2>

    <div class="file-group">
        <label>شيت A (المخزون الأساسي):</label>
        <input type="file" id="fileA" accept=".xlsx, .xls">
    </div>

    <div class="file-group">
        <label>شيت B (الأسعار المعدلة):</label>
        <input type="file" id="fileB" accept=".xlsx, .xls">
    </div>

    <button onclick="processFiles()">مطابقة وإنشاء ملف الطباعة العمودي</button>

    <div id="status"></div>
</div>

<script>
    const { jsPDF } = window.jspdf;

    function readExcel(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);
                    resolve(json);
                } catch (err) {
                    reject(err);
                }
            };
            reader.onerror = (error) => reject(error);
            reader.readAsArrayBuffer(file);
        });
    }

    function getValue(row, possibleKeys) {
        for (let key in row) {
            const cleanKey = key.trim().toLowerCase();
            for (let p of possibleKeys) {
                if (cleanKey === p.toLowerCase()) {
                    return row[key];
                }
            }
        }
        return null;
    }

    async function processFiles() {
        const fileAInput = document.getElementById('fileA').files[0];
        const fileBInput = document.getElementById('fileB').files[0];
        const status = document.getElementById('status');

        if (!fileAInput || !fileBInput) {
            alert('برجاء اختيار الملفين أولاً');
            return;
        }

        status.style.color = 'blue';
        status.innerText = 'جاري المعالجة والمطابقة...';

        try {
            const dataA = await readExcel(fileAInput);
            const dataB = await readExcel(fileBInput);

            const mapA = new Map();
            dataA.forEach(row => {
                const ref = getValue(row, ['Product Ref', 'ProductRef', 'ref', 'الرمز', 'الكود']);
                const name = getValue(row, ['Product Name', 'ProductName', 'الاسم', 'اسم الصنف']);
                if (ref !== null && ref !== undefined) {
                    mapA.set(String(ref).trim(), name || '');
                }
            });

            const matchedData = [];
            dataB.forEach(row => {
                const ref = getValue(row, ['product ref', 'Product Ref', 'ref', 'الكود']);
                const price = getValue(row, ['price', 'Price', 'السعر']);

                if (ref !== null && ref !== undefined) {
                    const cleanRef = String(ref).trim();
                    if (mapA.has(cleanRef)) {
                        matchedData.push({
                            ref: cleanRef,
                            price: price !== null ? parseFloat(price).toFixed(2) : '',
                            name: mapA.get(cleanRef)
                        });
                    }
                }
            });

            if (matchedData.length === 0) {
                status.style.color = 'red';
                status.innerText = 'لم يتم العثور على أكواد مطابقة بين الشيتين!';
                return;
            }

            status.innerText = `جاري تجهيز الملصقات لـ (${matchedData.length}) صنف...`;
            await generatePDF(matchedData);
            status.style.color = 'green';
            status.innerText = `تم مطابقة ${matchedData.length} صنف وإنشاء ملف الطباعة العمودي بنجاح!`;

        } catch (error) {
            console.error(error);
            status.style.color = 'red';
            status.innerText = 'حدث خطأ أثناء معالجة الملفات: ' + error.message;
        }
    }

    // دالة تقسيم اسم الصنف الطويل إلى أسطر
    function wrapText(ctx, text, maxWidth) {
        const words = text.split(' ');
        const lines = [];
        let currentLine = words[0] || '';

        for (let i = 1; i < words.length; i++) {
            const word = words[i];
            const width = ctx.measureText(currentLine + " " + word).width;
            if (width < maxWidth) {
                currentLine += " " + word;
            } else {
                lines.push(currentLine);
                currentLine = word;
            }
        }
        lines.push(currentLine);
        return lines;
    }

    function createLabelImage(item) {
        return new Promise((resolve) => {
            const canvas = document.createElement('canvas');
            const scale = 2;
            // العرض 80mm والارتفاع 45mm بتنسيق رأسي عمودي
            canvas.width = 300 * scale; 
            canvas.height = 165 * scale; 
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. اسم الصنف في المنتصف مرتفع قليلاً بخط كبير وواضح
            ctx.fillStyle = '#000000';
            ctx.font = `bold ${16 * scale}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.direction = 'rtl';

            const maxWidth = canvas.width - (20 * scale);
            const lines = wrapText(ctx, String(item.name), maxWidth);

            let currentY = 28 * scale;
            const lineHeight = 21 * scale;

            lines.forEach((line) => {
                ctx.fillText(line, canvas.width / 2, currentY);
                currentY += lineHeight;
            });

            // 2. السعر والـ Ref بخط صغير نسبياً في الأسفل
            ctx.font = `${11 * scale}px Arial, sans-serif`;
            const bottomY = 148 * scale;

            // السعر على اليمين
            ctx.textAlign = 'right';
            ctx.direction = 'ltr';
            ctx.fillText(`Price: ${item.price}`, canvas.width - (15 * scale), bottomY);

            // الـ Ref على اليسار
            ctx.textAlign = 'left';
            ctx.direction = 'ltr';
            ctx.fillText(`Ref: ${item.ref}`, 15 * scale, bottomY);

            resolve(canvas.toDataURL('image/jpeg', 0.95));
        });
    }

    async function generatePDF(items) {
        const labelWidth = 80;  // 80mm
        const labelHeight = 45; // 45mm

        // الضبط العمودي (Portrait 'p') للرول الحراري
        const doc = new jsPDF({
            orientation: 'p',
            unit: 'mm',
            format: [labelWidth, labelHeight]
        });

        for (let i = 0; i < items.length; i++) {
            if (i > 0) {
                doc.addPage([labelWidth, labelHeight], 'p');
            }
            const item = items[i];
            const imgData = await createLabelImage(item);
            doc.addImage(imgData, 'JPEG', 0, 0, labelWidth, labelHeight);
        }

        doc.output('dataurlnewwindow');
    }
</script>

</body>
</html>
